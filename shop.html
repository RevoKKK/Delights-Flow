<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4f46e5" />
  <title>Delights Flow — Opening Shop...</title>
  <script>
    // Preserve dark mode background to prevent white flash during redirect
    try {
      const dm = localStorage.getItem('df_dark');
      const isDark = dm === '1' || (dm === null && matchMedia('(prefers-color-scheme:dark)').matches);
      document.documentElement.style.background = isDark ? '#020617' : '#f8fafc';
      document.documentElement.style.color = isDark ? '#f1f5f9' : '#0f172a';
    } catch {}

    // Instantly redirect legacy shop.html links (including ?tx=...) into unified SPA
    try {
      const target = `./index.html${location.search || ''}#shop`;
      location.replace(target);
    } catch {
      location.href = './index.html#shop';
    }
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0;url=./index.html#shop" />
  </noscript>
</head>
<body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:24px;">
  <div>
    <p style="font-size:14px;font-weight:700;margin:0 0 12px;">Opening Delights Flow Shop...</p>
    <a href="./index.html#shop" style="display:inline-block;padding:10px 18px;border-radius:12px;background:#4f46e5;color:#ffffff;font-size:13px;font-weight:700;text-decoration:none;">Continue to Shop</a>
  </div>
</body>
</html>
